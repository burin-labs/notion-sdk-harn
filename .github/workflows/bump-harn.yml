name: Bump Harn Runtime

# fleet.toml in harn-bump-fleet owns this generated dispatch adapter.
on:
  push:
    branches:
      - "main"
    paths:
      - ".github/workflows/bump-harn.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Optional exact Harn tag (vX.Y.Z). Defaults to latest."
        required: false
        type: string

permissions:
  contents: read

jobs:
  bump:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: burin-labs/harn/.github/workflows/bump-harn.yml@6f1796501c9870074644c47c50200b05f4548e03
    with:
      orchestration-sha: 6f1796501c9870074644c47c50200b05f4548e03
      version: ${{ inputs.version }}
      # Capability migrations can rewrite this repository's generated SDK. Regenerate
      # the SDK and its provenance receipt together so the signed bump commit cannot
      # carry generated output whose recorded identity is stale.
      refresh-command: |-
        harn install --locked || harn install
        harn run scripts/regen.harn -- --apply
      validate-command: |-
        harn package verify .
        harn run scripts/check_generated_provenance.harn
        harn run tests/recorded/notion_sdk_smoke.harn
      publish-failure-for-repair: true
      apply-behavior-preserving-fixes: false
    secrets:
      app-client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
