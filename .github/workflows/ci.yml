name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    uses: burin-labs/.github/.github/workflows/harn-package.yml@1acf9aba857a8eb512014d7097bfb22b2e751ff8

  generated-sdk:
    name: Generated SDK and consumer smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Install pinned Harn
        uses: burin-labs/harn/.github/actions/setup-harn@e2089cd9628995bf2080cd1515086a891dff34f4
      - name: Check generated SDK provenance
        run: harn run scripts/check_generated_provenance.harn
      - name: Run recorded smoke tests
        run: harn run tests/recorded/notion_sdk_smoke.harn
      - name: Smoke-test package installation
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          cd "$smoke_root"
          harn new package consumer
          cd consumer
          harn add "$GITHUB_WORKSPACE@HEAD"
          harn install --locked
          cat > smoke.harn <<'EOF'
          import { new_client } from "notion-sdk-harn/default"
          import { decode_thrown, paginate } from "notion-sdk-harn/helpers"

          pipeline default() {
            let _ = new_client
            let _decode = decode_thrown
            let _paginate = paginate
          }
          EOF
          harn check smoke.harn

  status:
    name: CI status
    if: always()
    needs: [package, generated-sdk]
    runs-on: ubuntu-latest
    steps:
      - name: Enforce required jobs
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          SDK_RESULT: ${{ needs.generated-sdk.result }}
        run: test "$PACKAGE_RESULT" = success && test "$SDK_RESULT" = success
