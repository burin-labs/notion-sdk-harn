name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  harn:
    name: Harn
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read Harn version
        id: harn-version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < .harn-version)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Cache harn-cli
        uses: actions/cache@v4
        with:
          path: |
            .harn/ci-harn/${{ steps.harn-version.outputs.version }}
          key: harn-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.harn-version.outputs.version }}-${{ hashFiles('.harn-version') }}
          restore-keys: |
            harn-cli-${{ runner.os }}-${{ runner.arch }}-${{ steps.harn-version.outputs.version }}-

      - name: Install harn-cli
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.harn-version.outputs.version }}"
          tag="v${version#v}"
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64) asset="harn-x86_64-unknown-linux-gnu.tar.gz" ;;
            Linux-ARM64) asset="harn-aarch64-unknown-linux-gnu.tar.gz" ;;
            *)
              echo "unsupported runner for Harn release binary: ${RUNNER_OS}-${RUNNER_ARCH}" >&2
              exit 1
              ;;
          esac
          harn_root="${GITHUB_WORKSPACE}/.harn/ci-harn/${version}"
          if [[ ! -x "${harn_root}/bin/harn" ]]; then
            mkdir -p "${harn_root}/bin"
            curl -fsSL \
              -o "${RUNNER_TEMP}/${asset}" \
              "https://github.com/burin-labs/harn/releases/download/${tag}/${asset}"
            curl -fsSL \
              -o "${RUNNER_TEMP}/SHA256SUMS" \
              "https://github.com/burin-labs/harn/releases/download/${tag}/SHA256SUMS"
            (cd "${RUNNER_TEMP}" && grep "  ${asset}$" SHA256SUMS | sha256sum -c -)
            tar -xzf "${RUNNER_TEMP}/${asset}" -C "${harn_root}/bin"
          fi
          echo "${harn_root}/bin" >> "${GITHUB_PATH}"
          echo "HARN_BIN=${harn_root}/bin/harn" >> "${GITHUB_ENV}"

      - name: Show Harn version
        run: harn --version

      - name: Install Harn dependencies
        run: harn install --locked

      - name: Check package manifest
        run: harn package check

      - name: Check
        run: harn check src scripts tests

      - name: Lint
        run: harn lint src scripts tests

      - name: Format
        run: harn fmt --check src scripts tests

      - name: Regen drift check
        run: harn run scripts/regen.harn

      - name: Recorded smoke tests
        run: harn run tests/recorded/notion_sdk_smoke.harn

      - name: Package install smoke
        shell: bash
        run: |
          set -euo pipefail
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          cat > "$smoke_root/harn.toml" <<'EOF'
          [package]
          name = "notion-sdk-harn-consumer-smoke"
          version = "0.0.0"
          EOF
          cd "$smoke_root"
          harn add "$GITHUB_WORKSPACE@HEAD"
          harn install --locked
          cat > smoke.harn <<'EOF'
          import { new_client } from "notion-sdk-harn/default"
          import { decode_thrown, paginate } from "notion-sdk-harn/helpers"

          pipeline default() {
            let _ = new_client
            let _decode = decode_thrown
            let _paginate = paginate
          }
          EOF
          harn check smoke.harn

  ci-status:
    name: CI status
    if: always()
    needs: [harn]
    runs-on: ubuntu-latest
    steps:
      - name: Check for failures
        run: |
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo "One or more CI jobs failed"
            exit 1
          fi
          echo "All CI jobs passed or were skipped"
